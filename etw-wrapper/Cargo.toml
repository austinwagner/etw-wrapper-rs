[package]
name = "etw-wrapper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Strongly typed Event Tracing for Windows (ETW) logger generation"
documentation = "https://docs.rs/etw-wrapper"

# This is a Windows-only crate, so build the docs against a Windows target rather than the
# default Linux one. `--cfg docsrs` turns on the `doc_cfg` feature banners set up in lib.rs.
[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-pc-windows-msvc"
targets = ["x86_64-pc-windows-msvc"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
etw-wrapper-macro = { version = "0.2", optional = true, path = "../etw-wrapper-macro" }
windows-link = { workspace = true }
safe-sid = { workspace = true }

[features]
default = ["macro"]
macro = ["dep:etw-wrapper-macro"]

[[example]]
name = "example"
required-features = ["macro"]

[[test]]
name = "all_types"
required-features = ["macro"]

[[test]]
name = "arrays"
required-features = ["macro"]

[[test]]
name = "fieldref"
required-features = ["macro"]

[[test]]
name = "hex"
required-features = ["macro"]
