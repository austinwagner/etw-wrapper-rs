name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup component add rustfmt clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy with default features
        run: cargo clippy --workspace --locked --all-targets -- -D warnings

      - name: Run Clippy with all features
        run: cargo clippy --workspace --locked --all-targets --all-features -- -D warnings

      - name: Test with default features
        run: cargo test --workspace --locked

      - name: Test with all features
        run: cargo test --workspace --locked --all-features

      - name: Verify etw-wrapper-macro package
        run: cargo package --package etw-wrapper-macro --locked

      - name: List etw-wrapper package contents
        run: cargo package --package etw-wrapper --locked --list
