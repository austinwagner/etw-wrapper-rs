name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  msrv:
    name: Check MSRV
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust 1.88
        run: rustup toolchain install 1.88.0 --profile minimal --no-self-update

      - name: Check with MSRV
        run: cargo +1.88.0 check --locked --all-targets --all-features

  semver:
    name: Check semver
    if: github.event_name == 'pull_request' && github.base_ref == 'main' && startsWith(github.head_ref, 'release/')
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check semver
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: etw-wrapper

  test:
    name: Test
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup component add rustfmt clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Verify generated bindings
        run: |
          cargo clippy --locked --package xtask --all-targets -- -D warnings
          cargo xtask regenerate-bindings
          git diff --exit-code -- etw-wrapper/src/bindings.rs

      - name: Run Clippy with default features
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run Clippy with all features
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test with default features
        run: cargo test --locked

      - name: Test with all features
        run: cargo test --locked --all-features

      - name: Verify etw-wrapper-macro package
        run: cargo package --package etw-wrapper-macro --locked

      - name: List etw-wrapper package contents
        run: cargo package --package etw-wrapper --locked --list
